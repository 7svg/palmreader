<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020617">
  <title>Consultation feedback</title>
  <link rel="icon" href="palmlogo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    input, select, textarea, button { font-size: 16px; }
    :focus-visible { outline: 2px solid #fbbf24; outline-offset: 3px; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 shadow-xl text-center">
    <img src="palmlogo.png" alt="" class="w-14 h-14 mx-auto rounded-xl" onerror="this.style.display='none'">

    <!-- Form -->
    <div id="formView" class="space-y-4">
      <div>
        <h1 class="text-xl font-bold text-amber-400">How was your reading?</h1>
        <p class="text-xs text-slate-400 mt-1">Your rating helps us improve future consultations.</p>
      </div>

      <div id="starContainer" class="flex justify-center gap-2 py-1" role="radiogroup" aria-label="Rating out of 5"></div>
      <p id="ratingLabel" class="text-xs text-slate-400 -mt-2"></p>

      <textarea id="reviewText" rows="4" maxlength="1000"
                class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:border-amber-400 outline-none"
                placeholder="What stood out about the session? (optional)"></textarea>

      <p id="errorBox" class="hidden text-xs text-red-400 bg-red-500/10 border border-red-500/30 rounded-lg p-2.5 text-left"></p>

      <button id="submitBtn"
              class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition disabled:opacity-60">
        Send feedback
      </button>
    </div>

    <!-- Thanks -->
    <div id="thanksView" class="hidden space-y-3 py-4">
      <div class="w-12 h-12 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-xl font-bold">✓</div>
      <h1 class="text-lg font-bold text-slate-100">Thank you</h1>
      <p class="text-xs text-slate-400">Your feedback has been recorded.</p>
    </div>

    <!-- Bad or missing link -->
    <div id="invalidView" class="hidden space-y-3 py-4">
      <h1 class="text-lg font-bold text-slate-100">This link isn't valid</h1>
      <p class="text-xs text-slate-400">Feedback links are personal to each consultation. Please use the exact link sent to you on WhatsApp.</p>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var SUPABASE_URL      = "https://simfpaytvkqgknrrhvoj.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_rfqgEkkZhzNEWKCxtPNZog_no_8KR5F";

  var LABELS = ["", "Poor", "Fair", "Good", "Very good", "Excellent"];

  var $ = function (id) { return document.getElementById(id); };
  var client = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

  var rating = 0;
  var submissionId = new URLSearchParams(location.search).get("id");

  // A valid link carries a UUID. Anything else is a broken or hand-typed link.
  var isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(submissionId || "");
  if (!isUuid) {
    $("formView").classList.add("hidden");
    $("invalidView").classList.remove("hidden");
    return;
  }

  /* ---------- stars ---------- */
  var container = $("starContainer");
  for (var i = 1; i <= 5; i++) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "text-4xl leading-none transition text-slate-600 hover:scale-110";
    b.textContent = "★";
    b.setAttribute("role", "radio");
    b.setAttribute("aria-checked", "false");
    b.setAttribute("aria-label", i + " star" + (i > 1 ? "s" : ""));
    b.dataset.value = i;
    b.addEventListener("click", function () { setRating(Number(this.dataset.value)); });
    container.appendChild(b);
  }

  function setRating(r) {
    rating = r;
    Array.prototype.forEach.call(container.children, function (star, idx) {
      var on = idx < r;
      star.className = "text-4xl leading-none transition hover:scale-110 " + (on ? "text-amber-400" : "text-slate-600");
      star.setAttribute("aria-checked", on && idx === r - 1 ? "true" : "false");
    });
    $("ratingLabel").textContent = LABELS[r] || "";
    showError("");
  }

  function showError(msg) {
    var box = $("errorBox");
    box.textContent = msg;
    box.classList.toggle("hidden", !msg);
  }

  /* ---------- submit ---------- */
  $("submitBtn").addEventListener("click", submitReview);

  async function submitReview() {
    if (!rating) return showError("Please tap a star rating first.");
    if (!client) return showError("Couldn't connect. Check your internet and try again.");

    var btn = $("submitBtn");
    btn.disabled = true;
    btn.textContent = "Sending…";
    showError("");

    var res = await client.rpc("submit_feedback", {
      p_id:     submissionId,
      p_rating: rating,
      p_review: $("reviewText").value.trim() || null
    });

    if (res.error) {
      btn.disabled = false;
      btn.textContent = "Send feedback";
      showError(res.error.message || "Something went wrong. Please try again.");
      return;
    }

    if (res.data === "already_submitted") {
      $("formView").classList.add("hidden");
      $("thanksView").classList.remove("hidden");
      $("thanksView").querySelector("p").textContent = "We already have your feedback for this consultation.";
      return;
    }

    if (res.data === "not_found") {
      $("formView").classList.add("hidden");
      $("invalidView").classList.remove("hidden");
      return;
    }

    $("formView").classList.add("hidden");
    $("thanksView").classList.remove("hidden");
  }
})();
</script>
</body>
</html>
