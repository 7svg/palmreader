<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F6F2FC">
  <title>Consultations — Palm Reader</title>
  <link rel="icon" href="palmlogo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            page:    "#F6F2FC",
            field:   "#FAF8FE",
            line:    "#E2D9F3",
            ink:     { DEFAULT: "#2A1D4F", soft: "#6A5B8C", faint: "#A79BC4" },
            saffron: { DEFAULT: "#F0A22E", deep: "#D68A12", light: "#FFF1D6" },
            mehndi:  { DEFAULT: "#3E8E5A", light: "#DFF3E6" },
            sindoor: { DEFAULT: "#D8434E", light: "#FBE1E3" },
            gold:    "#C9A24D"
          },
          fontFamily: { sans: ['"Plus Jakarta Sans"', "system-ui", "sans-serif"] },
          boxShadow: {
            card: "0 10px 30px -12px rgba(42,29,79,0.18)",
            lift: "0 6px 14px -6px rgba(214,138,18,0.45)"
          }
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
    input, select, textarea, button { font-size: 16px; font-family: inherit; }
    @media (min-width: 768px) { input, select, textarea, button { font-size: inherit; } }
    :focus-visible { outline: 3px solid #F0A22E; outline-offset: 2px; border-radius: 10px; }
  </style>
</head>
<body class="bg-page text-ink min-h-screen">

  <!-- ================= LOGIN ================= -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white border border-line rounded-3xl p-7 space-y-5 shadow-card">
      <div class="text-center">
        <img src="palmlogo.png" alt="" class="w-14 h-14 mx-auto rounded-2xl mb-3" onerror="this.style.display='none'">
        <h1 class="text-2xl font-extrabold leading-tight">Consultations</h1>
        <p class="text-sm text-ink-soft mt-1">Sign in to see client submissions.</p>
      </div>
      <div>
        <label for="email" class="block text-sm font-semibold mb-1.5">Email</label>
        <input id="email" type="email" autocomplete="username"
               class="w-full bg-field border-2 border-line rounded-xl px-4 py-3 text-base focus:border-saffron outline-none">
      </div>
      <div>
        <label for="password" class="block text-sm font-semibold mb-1.5">Password</label>
        <input id="password" type="password" autocomplete="current-password"
               class="w-full bg-field border-2 border-line rounded-xl px-4 py-3 text-base focus:border-saffron outline-none">
      </div>
      <p id="loginError" class="hidden text-sm text-sindoor bg-sindoor-light border border-sindoor/30 rounded-xl px-4 py-3 font-semibold"></p>
      <button id="loginBtn" class="w-full bg-saffron hover:bg-saffron-deep text-ink text-lg font-extrabold py-3.5 rounded-2xl shadow-lift transition disabled:opacity-50">
        Sign in
      </button>
    </div>
  </div>

  <!-- ================= APP ================= -->
  <div id="appScreen" class="hidden max-w-7xl mx-auto p-4 md:p-6 space-y-5">

    <div class="flex flex-wrap items-center justify-between gap-3 border-b-2 border-line pb-4">
      <div class="flex items-center gap-3">
        <img src="palmlogo.png" alt="" class="w-11 h-11 rounded-xl hidden sm:block" onerror="this.style.display='none'">
        <div>
          <h1 class="text-2xl md:text-3xl font-extrabold leading-tight">Consultations</h1>
          <p class="text-sm text-ink-soft">Review palm prints, add notes, and close out each reading.</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span id="userEmail" class="text-xs text-ink-faint hidden sm:inline mr-1"></span>
        <button id="refreshBtn" class="bg-white border-2 border-line hover:border-saffron text-ink font-semibold px-3.5 py-2 rounded-xl text-sm transition">Refresh</button>
        <button id="logoutBtn" class="bg-white border-2 border-line hover:border-saffron text-ink font-semibold px-3.5 py-2 rounded-xl text-sm transition">Sign out</button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

      <!-- List -->
      <div class="bg-white border border-line rounded-3xl p-4 md:h-[78vh] md:overflow-y-auto space-y-3 shadow-card">
        <div class="flex items-center gap-2">
          <input id="searchBox" type="search" placeholder="Search name or mobile"
                 class="flex-1 min-w-0 bg-field border-2 border-line rounded-xl px-3 py-2.5 text-sm focus:border-saffron outline-none">
          <select id="statusFilter" class="bg-field border-2 border-line rounded-xl px-2 py-2.5 text-sm focus:border-saffron outline-none">
            <option value="">All</option>
            <option value="New">New</option>
            <option value="Photos Incomplete">Incomplete</option>
            <option value="Call Scheduled">Scheduled</option>
            <option value="Completed">Completed</option>
          </select>
        </div>
        <p id="listCount" class="text-xs text-ink-faint px-1"></p>
        <div id="inquiryList" class="space-y-2">
          <p class="text-sm text-ink-faint">Loading…</p>
        </div>
      </div>

      <!-- Detail -->
      <div id="detailPanel" class="md:col-span-2 bg-white border border-line rounded-3xl p-5 md:p-6 md:h-[78vh] md:overflow-y-auto hidden space-y-6 shadow-card">

        <div class="flex flex-wrap items-start justify-between gap-3 border-b-2 border-line pb-4">
          <div class="min-w-0">
            <h2 id="clientName" class="text-2xl font-extrabold truncate"></h2>
            <p id="clientMeta" class="text-sm text-ink-soft mt-2 leading-relaxed"></p>
          </div>
          <div class="flex flex-wrap gap-2">
            <button id="whatsappBtn" class="bg-white border-2 border-line hover:border-saffron text-ink font-semibold text-sm px-3.5 py-2 rounded-xl transition">Message</button>
            <button id="markScheduledBtn" class="bg-ink hover:bg-ink-soft text-white font-semibold text-sm px-3.5 py-2 rounded-xl transition">Mark scheduled</button>
            <button id="completeBtn" class="bg-mehndi hover:bg-mehndi/90 text-white font-semibold text-sm px-3.5 py-2 rounded-xl transition">Complete &amp; send review link</button>
          </div>
        </div>

        <div>
          <h3 class="text-base font-extrabold mb-3">Captured photos</h3>
          <div id="photoGrid" class="space-y-5"></div>
          <p id="photoEmpty" class="hidden text-sm text-ink-faint">No photos were uploaded for this client yet.</p>
        </div>

        <div id="feedbackBlock" class="hidden bg-page border border-line rounded-2xl p-4">
          <h3 class="text-sm font-extrabold mb-1">Client feedback</h3>
          <p id="feedbackStars" class="text-saffron text-2xl leading-none"></p>
          <p id="feedbackText" class="text-sm text-ink-soft mt-2"></p>
        </div>

        <div>
          <div class="flex items-center justify-between mb-2">
            <h3 class="text-base font-extrabold">Consultation notes</h3>
            <span id="notesStatus" class="text-xs text-ink-faint"></span>
          </div>
          <textarea id="astrologerNotes" rows="6"
                    class="w-full bg-field border-2 border-line rounded-2xl p-4 text-sm leading-relaxed focus:border-saffron outline-none"
                    placeholder="Line formations, mounts, guidance points… saves by itself as you type."></textarea>
        </div>
      </div>

    </div>
  </div>

  <!-- Lightbox with previous / next -->
  <div id="lightbox" class="hidden fixed inset-0 z-50 bg-ink/90 flex flex-col items-center justify-center p-4" role="dialog" aria-modal="true">
    <div class="relative w-full max-w-3xl flex items-center justify-center">
      <button id="lightboxPrev" type="button" aria-label="Previous photo"
              class="absolute left-0 md:-left-14 w-11 h-11 rounded-full bg-white/15 hover:bg-white/30 text-white text-2xl flex items-center justify-center">‹</button>
      <img id="lightboxImg" alt="" class="max-w-full max-h-[76vh] rounded-2xl object-contain">
      <button id="lightboxNext" type="button" aria-label="Next photo"
              class="absolute right-0 md:-right-14 w-11 h-11 rounded-full bg-white/15 hover:bg-white/30 text-white text-2xl flex items-center justify-center">›</button>
    </div>
    <p id="lightboxLabel" class="text-base text-white font-bold mt-4"></p>
    <p id="lightboxCount" class="text-xs text-white/60 mt-1"></p>
    <div class="flex gap-3 mt-4">
      <a id="lightboxOpen" href="#" target="_blank" rel="noopener"
         class="bg-white/15 hover:bg-white/25 text-white text-sm font-semibold px-4 py-2.5 rounded-xl">Open in Drive</a>
      <button id="lightboxClose" class="bg-saffron hover:bg-saffron-deep text-ink font-extrabold text-sm px-5 py-2.5 rounded-xl">Close</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl text-sm font-semibold shadow-card"></div>

<script>
(function () {
  "use strict";

  var SUPABASE_URL      = "https://simfpaytvkqgknrrhvoj.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_rfqgEkkZhzNEWKCxtPNZog_no_8KR5F";

  var BASE_LABELS = {
    full_open: "Open palm", back_hand: "Back of hand", upper_mounts: "Upper mounts",
    side_percussion: "Side edge", thumb_venus: "Thumb base", thumb_pad: "Thumb print",
    index_pad: "Index print", middle_pad: "Middle print", ring_pad: "Ring print", pinky_pad: "Little print"
  };
  var BASE_ORDER = Object.keys(BASE_LABELS);
  var HANDS = ["Right", "Left"];
  var STEP_ORDER = [];
  HANDS.forEach(function (h) { BASE_ORDER.forEach(function (b) { STEP_ORDER.push(h.toLowerCase() + "_" + b); }); });

  function splitKey(key) {
    var m = /^(right|left)_(.+)$/.exec(key);
    if (!m) return { hand: "", base: key };
    return { hand: m[1].charAt(0).toUpperCase() + m[1].slice(1), base: m[2] };
  }
  function labelFor(key) {
    var p = splitKey(key), base = BASE_LABELS[p.base] || p.base.replace(/_/g, " ");
    return p.hand ? base + " (" + p.hand + ")" : base;
  }

  var $ = function (id) { return document.getElementById(id); };
  var client = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

  var inquiries = [], active = null;
  var lightboxKeys = [], lightboxIndex = 0;

  function esc(v) {
    return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function toast(msg, tone) {
    var el = $("toast");
    el.textContent = msg;
    el.className = "fixed bottom-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl text-sm font-semibold shadow-card " +
      (tone === "error" ? "bg-sindoor text-white" : "bg-mehndi text-white");
    el.classList.remove("hidden");
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.add("hidden"); }, 2600);
  }
  function driveThumb(url, size) {
    if (!url) return "";
    var m = url.match(/[?&]id=([a-zA-Z0-9_-]{20,})/) || url.match(/\/d\/([a-zA-Z0-9_-]{20,})/);
    return m ? "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w" + (size || 800) : url;
  }
  function fmtDate(v) {
    if (!v) return "not given";
    var d = new Date(v);
    return isNaN(d) ? String(v) : d.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
  }
  function statusPill(status) {
    var map = {
      "Completed":         "bg-mehndi-light text-mehndi",
      "Call Scheduled":    "bg-line text-ink",
      "Photos Incomplete": "bg-sindoor-light text-sindoor",
      "Awaiting Photos":   "bg-page text-ink-faint"
    };
    return map[status] || "bg-saffron-light text-saffron-deep";
  }

  /* ---------- auth ---------- */
  $("loginBtn").addEventListener("click", signIn);
  $("password").addEventListener("keydown", function (e) { if (e.key === "Enter") signIn(); });
  $("logoutBtn").addEventListener("click", function () { client.auth.signOut().then(function () { location.reload(); }); });

  async function signIn() {
    if (!client) return showLoginError("Couldn't load. Check your connection and refresh.");
    var btn = $("loginBtn");
    btn.disabled = true; btn.textContent = "Signing in…"; showLoginError("");
    var res = await client.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
    btn.disabled = false; btn.textContent = "Sign in";
    if (res.error) return showLoginError(res.error.message);
    enterApp(res.data.session);
  }
  function showLoginError(msg) { var b = $("loginError"); b.textContent = msg; b.classList.toggle("hidden", !msg); }
  function enterApp(session) {
    $("loginScreen").classList.add("hidden");
    $("appScreen").classList.remove("hidden");
    $("userEmail").textContent = session && session.user ? session.user.email : "";
    fetchInquiries();
  }

  /* ---------- data ---------- */
  $("refreshBtn").addEventListener("click", fetchInquiries);
  $("searchBox").addEventListener("input", renderList);
  $("statusFilter").addEventListener("change", renderList);
  $("markScheduledBtn").addEventListener("click", function () { updateStatus("Call Scheduled"); });
  $("completeBtn").addEventListener("click", completeAndSendFeedback);
  $("whatsappBtn").addEventListener("click", openWhatsApp);

  async function fetchInquiries() {
    if (!client) return;
    $("inquiryList").innerHTML = '<p class="text-sm text-ink-faint">Loading…</p>';
    var res = await client.from("palm_inquiries").select("*").order("created_at", { ascending: false }).limit(500);
    if (res.error) {
      $("inquiryList").innerHTML = '<p class="text-sm text-sindoor font-semibold">Couldn\'t load submissions: ' + esc(res.error.message) + '</p>';
      return;
    }
    inquiries = res.data || [];
    renderList();
    if (active) {
      var again = inquiries.filter(function (i) { return i.id === active.id; })[0];
      if (again) selectInquiry(again);
    }
  }

  function visibleInquiries() {
    var q = $("searchBox").value.trim().toLowerCase(), status = $("statusFilter").value;
    return inquiries.filter(function (i) {
      if (status && i.status !== status) return false;
      if (!q) return true;
      return (i.full_name || "").toLowerCase().indexOf(q) !== -1 || (i.mobile || "").indexOf(q) !== -1;
    });
  }

  function renderList() {
    var list = visibleInquiries(), c = $("inquiryList");
    $("listCount").textContent = list.length === inquiries.length
      ? inquiries.length + " submissions" : list.length + " of " + inquiries.length + " submissions";
    if (!list.length) {
      c.innerHTML = '<p class="text-sm text-ink-faint">Nothing here yet. New submissions appear at the top.</p>';
      return;
    }
    c.innerHTML = list.map(function (item) {
      var count = item.photos ? Object.keys(item.photos).length : 0;
      var isActive = active && active.id === item.id;
      return '' +
        '<button type="button" data-id="' + esc(item.id) + '" class="inquiry-card w-full text-left p-3.5 rounded-2xl border-2 transition ' +
          (isActive ? "bg-saffron-light border-saffron" : "bg-field border-transparent hover:border-line") + '">' +
          '<div class="flex items-center justify-between gap-2">' +
            '<span class="font-extrabold text-sm truncate">' + esc(item.full_name || "Unnamed") + '</span>' +
            '<span class="text-[11px] px-2 py-0.5 rounded-full font-bold shrink-0 ' + statusPill(item.status) + '">' + esc(item.status || "New") + '</span>' +
          '</div>' +
          '<p class="text-xs text-ink-soft mt-1">' + fmtDate(item.created_at) + ' &nbsp; ' + esc(item.mobile || "no number") + '</p>' +
          '<p class="text-xs text-ink-faint mt-0.5">' + count + ' of 20 photos &nbsp;&nbsp; Dominant: ' + esc(item.dominant_hand || "not given") + '</p>' +
        '</button>';
    }).join("");
    Array.prototype.forEach.call(c.querySelectorAll(".inquiry-card"), function (card) {
      card.addEventListener("click", function () {
        var id = this.getAttribute("data-id");
        var item = inquiries.filter(function (i) { return String(i.id) === id; })[0];
        if (item) selectInquiry(item);
      });
    });
  }

  function selectInquiry(item) {
    active = item;
    $("detailPanel").classList.remove("hidden");
    $("clientName").textContent = item.full_name || "Unnamed";
    $("clientMeta").innerHTML =
      "Born " + esc(fmtDate(item.dob)) + (item.birth_time ? " at " + esc(item.birth_time) : "") +
      ", " + esc(item.birth_place || "place not given") + "<br>" +
      esc(item.mobile || "no number") + "<br>" +
      "Dominant hand: <strong class=\"text-ink\">" + esc(item.dominant_hand || "not given") + "</strong>";
    $("astrologerNotes").value = item.astrologer_notes || "";
    $("notesStatus").textContent = "";

    var photos = item.photos || {};
    var known  = STEP_ORDER.filter(function (k) { return photos[k]; });
    var others = Object.keys(photos).filter(function (k) { return STEP_ORDER.indexOf(k) === -1; });
    lightboxKeys = known.concat(others);
    $("photoEmpty").classList.toggle("hidden", lightboxKeys.length > 0);

    function tile(key) {
      var label = labelFor(key);
      return '' +
        '<div class="space-y-1">' +
          '<button type="button" class="photo-btn block w-full aspect-[3/4] bg-page rounded-2xl overflow-hidden border-2 border-line hover:border-saffron transition" data-key="' + esc(key) + '">' +
            '<img src="' + esc(driveThumb(photos[key], 400)) + '" alt="' + esc(label) + '" loading="lazy" class="w-full h-full object-cover" ' +
              'onerror="this.parentNode.innerHTML=\'<span class=&quot;text-[11px] text-ink-faint&quot;>No preview</span>\'">' +
          '</button>' +
          '<p class="text-[11px] text-ink-soft truncate text-center">' + esc(label) + '</p>' +
        '</div>';
    }

    var html = "";
    HANDS.forEach(function (hand) {
      var inHand = known.filter(function (k) { return splitKey(k).hand === hand; });
      if (!inHand.length) return;
      html += '<div class="space-y-2">' +
                '<p class="text-sm font-extrabold">' + hand + ' hand ' +
                  '<span class="text-ink-faint font-semibold">' + inHand.length + ' of 10</span></p>' +
                '<div class="grid grid-cols-3 sm:grid-cols-5 gap-3">' + inHand.map(tile).join("") + '</div>' +
              '</div>';
    });
    var loose = known.filter(function (k) { return !splitKey(k).hand; }).concat(others);
    if (loose.length) {
      html += '<div class="space-y-2">' +
                '<p class="text-sm font-extrabold">Earlier submission <span class="text-ink-faint font-semibold">hand not recorded</span></p>' +
                '<div class="grid grid-cols-3 sm:grid-cols-5 gap-3">' + loose.map(tile).join("") + '</div>' +
              '</div>';
    }
    $("photoGrid").innerHTML = html;
    Array.prototype.forEach.call($("photoGrid").querySelectorAll(".photo-btn"), function (btn) {
      btn.addEventListener("click", function () { openLightbox(lightboxKeys.indexOf(this.getAttribute("data-key"))); });
    });

    var hasFeedback = item.client_rating || item.client_review;
    $("feedbackBlock").classList.toggle("hidden", !hasFeedback);
    if (hasFeedback) {
      var r = item.client_rating || 0;
      $("feedbackStars").textContent = "★".repeat(r) + "☆".repeat(Math.max(0, 5 - r));
      $("feedbackText").textContent = item.client_review || "No written comment.";
    }
    renderList();
    if (window.innerWidth < 768) $("detailPanel").scrollIntoView({ behavior: "smooth" });
  }

  /* ---------- lightbox ---------- */
  function openLightbox(i) {
    if (i < 0) return;
    lightboxIndex = i;
    var key = lightboxKeys[i], url = (active.photos || {})[key];
    $("lightboxImg").src = driveThumb(url, 1600);
    $("lightboxLabel").textContent = labelFor(key);
    $("lightboxCount").textContent = (i + 1) + " of " + lightboxKeys.length;
    $("lightboxOpen").href = url;
    $("lightboxPrev").disabled = i === 0;
    $("lightboxNext").disabled = i === lightboxKeys.length - 1;
    $("lightboxPrev").classList.toggle("opacity-30", i === 0);
    $("lightboxNext").classList.toggle("opacity-30", i === lightboxKeys.length - 1);
    $("lightbox").classList.remove("hidden");
  }
  function closeLightbox() { $("lightbox").classList.add("hidden"); $("lightboxImg").removeAttribute("src"); }
  $("lightboxClose").addEventListener("click", closeLightbox);
  $("lightboxPrev").addEventListener("click", function () { if (lightboxIndex > 0) openLightbox(lightboxIndex - 1); });
  $("lightboxNext").addEventListener("click", function () { if (lightboxIndex < lightboxKeys.length - 1) openLightbox(lightboxIndex + 1); });
  $("lightbox").addEventListener("click", function (e) { if (e.target === this) closeLightbox(); });
  document.addEventListener("keydown", function (e) {
    if ($("lightbox").classList.contains("hidden")) return;
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowLeft"  && lightboxIndex > 0) openLightbox(lightboxIndex - 1);
    if (e.key === "ArrowRight" && lightboxIndex < lightboxKeys.length - 1) openLightbox(lightboxIndex + 1);
  });

  /* ---------- notes: save by themselves ---------- */
  var notesTimer = null;
  $("astrologerNotes").addEventListener("input", function () {
    if (!active) return;
    $("notesStatus").textContent = "Typing…";
    clearTimeout(notesTimer);
    notesTimer = setTimeout(saveNotes, 900);
  });
  async function saveNotes() {
    if (!active) return;
    var forId = active.id, text = $("astrologerNotes").value;
    $("notesStatus").textContent = "Saving…";
    var res = await client.from("palm_inquiries").update({ astrologer_notes: text }).eq("id", forId).select().single();
    if (res.error) { $("notesStatus").textContent = "Not saved"; toast("Couldn't save notes: " + res.error.message, "error"); return; }
    if (active && active.id === forId) {
      active = res.data;
      var idx = inquiries.findIndex(function (i) { return i.id === forId; });
      if (idx > -1) inquiries[idx] = res.data;
      $("notesStatus").textContent = "Saved";
    }
  }

  /* ---------- actions ---------- */
  async function updateStatus(newStatus) {
    if (!active) return false;
    var res = await client.from("palm_inquiries").update({ status: newStatus }).eq("id", active.id).select().single();
    if (res.error) { toast("Couldn't update status: " + res.error.message, "error"); return false; }
    active = res.data;
    var idx = inquiries.findIndex(function (i) { return i.id === active.id; });
    if (idx > -1) inquiries[idx] = active;
    renderList();
    toast("Marked " + newStatus.toLowerCase());
    return true;
  }
  function waNumber(mobile) {
    var d = String(mobile || "").replace(/\D/g, "");
    if (!d) return null;
    if (d.length === 10) d = "91" + d;
    return d;
  }
  function openWhatsApp() {
    if (!active) return;
    var num = waNumber(active.mobile);
    if (!num) return toast("No mobile number on this record.", "error");
    window.open("https://wa.me/" + num, "_blank", "noopener");
  }
  function feedbackUrl(id) { return location.href.replace(/[^/]*$/, "") + "feedback.html?id=" + encodeURIComponent(id); }
  async function completeAndSendFeedback() {
    if (!active) return;
    var target = active, num = waNumber(target.mobile);
    if (!num) return toast("No mobile number on this record.", "error");
    var tab = window.open("", "_blank", "noopener");
    var ok = await updateStatus("Completed");
    if (!ok) { if (tab) tab.close(); return; }
    var msg = "Hello " + (target.full_name || "") + ", thank you for your palm reading consultation. " +
              "Please share your rating and review here: " + feedbackUrl(target.id);
    var href = "https://wa.me/" + num + "?text=" + encodeURIComponent(msg);
    if (tab) tab.location.href = href; else window.open(href, "_blank", "noopener");
  }

  /* ---------- boot ---------- */
  if (!client) {
    showLoginError("Couldn't load. Check your connection and refresh.");
  } else {
    client.auth.getSession().then(function (res) { if (res.data && res.data.session) enterApp(res.data.session); });
  }
})();
</script>
</body>
</html>
