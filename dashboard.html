<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultations — Palm Reader</title>
  <link rel="icon" href="palmlogo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    input, select, textarea, button { font-size: 16px; }
    :focus-visible { outline: 2px solid #fbbf24; outline-offset: 2px; }
    @media (min-width: 768px) { input, select, textarea, button { font-size: inherit; } }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- ================= LOGIN ================= -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-950 border border-slate-800 rounded-2xl p-6 space-y-4">
      <div class="text-center">
        <img src="palmlogo.png" alt="" class="w-14 h-14 mx-auto rounded-xl mb-3" onerror="this.style.display='none'">
        <h1 class="text-lg font-bold text-amber-400">Consultation dashboard</h1>
        <p class="text-xs text-slate-500 mt-1">Sign in to view client submissions.</p>
      </div>
      <div>
        <label for="email" class="block text-xs text-slate-400 mb-1">Email</label>
        <input id="email" type="email" autocomplete="username"
               class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm focus:border-amber-400 outline-none">
      </div>
      <div>
        <label for="password" class="block text-xs text-slate-400 mb-1">Password</label>
        <input id="password" type="password" autocomplete="current-password"
               class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-sm focus:border-amber-400 outline-none">
      </div>
      <p id="loginError" class="hidden text-xs text-red-400 bg-red-500/10 border border-red-500/30 rounded-lg p-2.5"></p>
      <button id="loginBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition disabled:opacity-60">
        Sign in
      </button>
    </div>
  </div>

  <!-- ================= APP ================= -->
  <div id="appScreen" class="hidden max-w-7xl mx-auto p-4 md:p-6 space-y-5">

    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-xl md:text-2xl font-bold text-amber-400">Consultations</h1>
        <p class="text-xs text-slate-400">Review palm prints, add notes, and close out each reading.</p>
      </div>
      <div class="flex items-center gap-2">
        <span id="userEmail" class="text-xs text-slate-500 hidden sm:inline"></span>
        <button id="refreshBtn" class="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg text-xs transition">Refresh</button>
        <button id="logoutBtn" class="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg text-xs transition">Sign out</button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

      <!-- List -->
      <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 md:h-[76vh] md:overflow-y-auto space-y-3">
        <div class="flex items-center gap-2">
          <input id="searchBox" type="search" placeholder="Search name or mobile"
                 class="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:border-amber-400 outline-none">
          <select id="statusFilter" class="bg-slate-900 border border-slate-800 rounded-lg px-2 py-2 text-xs focus:border-amber-400 outline-none">
            <option value="">All</option>
            <option value="New">New</option>
            <option value="Photos Incomplete">Incomplete</option>
            <option value="Call Scheduled">Scheduled</option>
            <option value="Completed">Completed</option>
          </select>
        </div>
        <div id="inquiryList" class="space-y-2">
          <p class="text-xs text-slate-500">Loading…</p>
        </div>
      </div>

      <!-- Detail -->
      <div id="detailPanel" class="md:col-span-2 bg-slate-950 border border-slate-800 rounded-xl p-4 md:p-6 md:h-[76vh] md:overflow-y-auto hidden space-y-6">

        <div class="flex flex-wrap items-start justify-between gap-3 border-b border-slate-800 pb-3">
          <div class="min-w-0">
            <h2 id="clientName" class="text-lg md:text-xl font-bold text-white truncate"></h2>
            <p id="clientMeta" class="text-xs text-slate-400 mt-1 leading-relaxed"></p>
          </div>
          <div class="flex flex-wrap gap-2">
            <button id="whatsappBtn" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded-lg">Message</button>
            <button id="markScheduledBtn" class="bg-blue-600/80 hover:bg-blue-600 text-xs px-3 py-2 rounded-lg">Mark scheduled</button>
            <button id="completeBtn" class="bg-emerald-600/80 hover:bg-emerald-600 text-xs px-3 py-2 rounded-lg">Complete &amp; send review link</button>
          </div>
        </div>

        <div>
          <h3 class="text-xs font-semibold text-slate-400 mb-3">Captured photos</h3>
          <div id="photoGrid" class="grid grid-cols-3 sm:grid-cols-5 gap-3"></div>
          <p id="photoEmpty" class="hidden text-xs text-slate-500">No photos were uploaded for this client yet.</p>
        </div>

        <div id="feedbackBlock" class="hidden bg-slate-900 border border-slate-800 rounded-lg p-4">
          <h3 class="text-xs font-semibold text-slate-400 mb-2">Client feedback</h3>
          <p id="feedbackStars" class="text-amber-400 text-lg leading-none"></p>
          <p id="feedbackText" class="text-sm text-slate-300 mt-2"></p>
        </div>

        <div>
          <h3 class="text-xs font-semibold text-slate-400 mb-2">Consultation notes</h3>
          <textarea id="astrologerNotes" rows="5"
                    class="w-full bg-slate-900 border border-slate-800 rounded-lg p-3 text-sm focus:border-amber-400 outline-none"
                    placeholder="Line formations, mounts, guidance points…"></textarea>
          <div class="flex items-center gap-3 mt-2">
            <button id="saveNotesBtn" class="bg-slate-800 hover:bg-slate-700 text-xs px-4 py-2 rounded-lg transition">Save notes</button>
            <span id="notesStatus" class="text-xs text-slate-500"></span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="hidden fixed inset-0 z-50 bg-black/90 flex flex-col items-center justify-center p-4" role="dialog" aria-modal="true">
    <img id="lightboxImg" alt="" class="max-w-full max-h-[80vh] rounded-lg object-contain">
    <p id="lightboxLabel" class="text-sm text-slate-300 mt-3"></p>
    <div class="flex gap-3 mt-4">
      <a id="lightboxOpen" href="#" target="_blank" rel="noopener"
         class="bg-slate-800 hover:bg-slate-700 text-xs px-4 py-2 rounded-lg">Open in Drive</a>
      <button id="lightboxClose" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs px-4 py-2 rounded-lg">Close</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-lg text-sm shadow-xl"></div>

<script>
(function () {
  "use strict";

  var SUPABASE_URL      = "https://simfpaytvkqgknrrhvoj.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_rfqgEkkZhzNEWKCxtPNZog_no_8KR5F";

  var STEP_LABELS = {
    full_open:       "Open palm",
    back_hand:       "Back of hand",
    upper_mounts:    "Upper mounts",
    side_percussion: "Side edge",
    thumb_venus:     "Thumb base",
    thumb_pad:       "Thumb print",
    index_pad:       "Index print",
    middle_pad:      "Middle print",
    ring_pad:        "Ring print",
    pinky_pad:       "Little print"
  };
  var STEP_ORDER = Object.keys(STEP_LABELS);

  var $ = function (id) { return document.getElementById(id); };
  var client = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

  var inquiries = [];
  var active = null;

  /* ---------- utilities ---------- */
  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function toast(msg, tone) {
    var el = $("toast");
    el.textContent = msg;
    el.className = "fixed bottom-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-lg text-sm shadow-xl " +
      (tone === "error" ? "bg-red-600 text-white" : "bg-emerald-600 text-white");
    el.classList.remove("hidden");
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.add("hidden"); }, 3000);
  }

  // Google Drive share links aren't directly embeddable; convert to the thumbnail endpoint.
  function driveThumb(url, size) {
    if (!url) return "";
    var id = "";
    var m = url.match(/[?&]id=([a-zA-Z0-9_-]{20,})/) || url.match(/\/d\/([a-zA-Z0-9_-]{20,})/);
    if (m) id = m[1];
    return id ? "https://drive.google.com/thumbnail?id=" + id + "&sz=w" + (size || 800) : url;
  }

  function fmtDate(v) {
    if (!v) return "—";
    var d = new Date(v);
    return isNaN(d) ? String(v) : d.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
  }

  function statusPill(status) {
    var map = {
      "Completed":         "bg-emerald-500/20 text-emerald-400",
      "Call Scheduled":    "bg-blue-500/20 text-blue-400",
      "Photos Incomplete": "bg-red-500/20 text-red-400",
      "Awaiting Photos":   "bg-slate-500/20 text-slate-400"
    };
    return map[status] || "bg-amber-500/20 text-amber-400";
  }

  /* ---------- auth ---------- */
  $("loginBtn").addEventListener("click", signIn);
  $("password").addEventListener("keydown", function (e) { if (e.key === "Enter") signIn(); });
  $("logoutBtn").addEventListener("click", function () {
    client.auth.signOut().then(function () { location.reload(); });
  });

  async function signIn() {
    if (!client) return showLoginError("Supabase library failed to load. Check your connection.");
    var btn = $("loginBtn");
    btn.disabled = true; btn.textContent = "Signing in…";
    showLoginError("");

    var res = await client.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("password").value
    });

    btn.disabled = false; btn.textContent = "Sign in";
    if (res.error) return showLoginError(res.error.message);
    enterApp(res.data.session);
  }

  function showLoginError(msg) {
    var box = $("loginError");
    box.textContent = msg;
    box.classList.toggle("hidden", !msg);
  }

  function enterApp(session) {
    $("loginScreen").classList.add("hidden");
    $("appScreen").classList.remove("hidden");
    $("userEmail").textContent = session && session.user ? session.user.email : "";
    fetchInquiries();
  }

  /* ---------- data ---------- */
  $("refreshBtn").addEventListener("click", fetchInquiries);
  $("searchBox").addEventListener("input", renderList);
  $("statusFilter").addEventListener("change", renderList);
  $("markScheduledBtn").addEventListener("click", function () { updateStatus("Call Scheduled"); });
  $("completeBtn").addEventListener("click", completeAndSendFeedback);
  $("whatsappBtn").addEventListener("click", openWhatsApp);
  $("saveNotesBtn").addEventListener("click", saveNotes);

  async function fetchInquiries() {
    if (!client) return;
    $("inquiryList").innerHTML = '<p class="text-xs text-slate-500">Loading…</p>';
    var res = await client
      .from("palm_inquiries")
      .select("*")
      .order("created_at", { ascending: false })
      .limit(500);

    if (res.error) {
      console.error(res.error);
      $("inquiryList").innerHTML =
        '<p class="text-xs text-red-400">Couldn\'t load submissions: ' + esc(res.error.message) + '</p>';
      return;
    }
    inquiries = res.data || [];
    renderList();
    if (active) {
      var again = inquiries.filter(function (i) { return i.id === active.id; })[0];
      if (again) selectInquiry(again);
    }
  }

  function visibleInquiries() {
    var q = $("searchBox").value.trim().toLowerCase();
    var status = $("statusFilter").value;
    return inquiries.filter(function (i) {
      if (status && i.status !== status) return false;
      if (!q) return true;
      return (i.full_name || "").toLowerCase().indexOf(q) !== -1 ||
             (i.mobile || "").indexOf(q) !== -1;
    });
  }

  function renderList() {
    var list = visibleInquiries();
    var container = $("inquiryList");

    if (!list.length) {
      container.innerHTML = '<p class="text-xs text-slate-500">Nothing here yet. New submissions appear at the top.</p>';
      return;
    }

    container.innerHTML = list.map(function (item) {
      var count = item.photos ? Object.keys(item.photos).length : 0;
      return '' +
        '<button type="button" data-id="' + esc(item.id) + '" ' +
        'class="inquiry-card w-full text-left p-3 bg-slate-900 hover:bg-slate-800/70 border rounded-lg transition ' +
        (active && active.id === item.id ? 'border-amber-400/60' : 'border-slate-800/80') + '">' +
          '<div class="flex items-center justify-between gap-2">' +
            '<span class="font-semibold text-sm text-slate-200 truncate">' + esc(item.full_name || "Unnamed") + '</span>' +
            '<span class="text-[10px] px-2 py-0.5 rounded-full shrink-0 ' + statusPill(item.status) + '">' +
              esc(item.status || "New") + '</span>' +
          '</div>' +
          '<p class="text-[11px] text-slate-400 mt-1">' +
            fmtDate(item.created_at) + ' &bull; ' + esc(item.mobile || "no number") +
            ' &bull; ' + count + '/10 photos</p>' +
        '</button>';
    }).join("");

    Array.prototype.forEach.call(container.querySelectorAll(".inquiry-card"), function (card) {
      card.addEventListener("click", function () {
        var id = this.getAttribute("data-id");
        var item = inquiries.filter(function (i) { return String(i.id) === id; })[0];
        if (item) selectInquiry(item);
      });
    });
  }

  function selectInquiry(item) {
    active = item;
    $("detailPanel").classList.remove("hidden");
    $("clientName").textContent = item.full_name || "Unnamed";
    $("clientMeta").textContent =
      "Born " + fmtDate(item.dob) + (item.birth_time ? " at " + item.birth_time : "") +
      " · " + (item.birth_place || "place not given") +
      " · " + (item.dominant_hand || "?") + " hand" +
      " · " + (item.mobile || "no number");
    $("astrologerNotes").value = item.astrologer_notes || "";
    $("notesStatus").textContent = "";

    // Photos, in capture order, unknown keys appended.
    var photos = item.photos || {};
    var keys = STEP_ORDER.filter(function (k) { return photos[k]; })
      .concat(Object.keys(photos).filter(function (k) { return STEP_ORDER.indexOf(k) === -1; }));

    $("photoEmpty").classList.toggle("hidden", keys.length > 0);
    $("photoGrid").innerHTML = keys.map(function (key) {
      var label = STEP_LABELS[key] || key.replace(/_/g, " ");
      return '' +
        '<div class="space-y-1">' +
          '<button type="button" class="photo-btn block w-full aspect-[3/4] bg-slate-900 rounded-lg overflow-hidden border border-slate-800 hover:border-amber-400 transition" ' +
            'data-url="' + esc(photos[key]) + '" data-label="' + esc(label) + '">' +
            '<img src="' + esc(driveThumb(photos[key], 400)) + '" alt="' + esc(label) + '" loading="lazy" ' +
              'class="w-full h-full object-cover" ' +
              'onerror="this.parentNode.innerHTML=\'<span class=&quot;text-[10px] text-slate-500&quot;>Preview unavailable</span>\'">' +
          '</button>' +
          '<p class="text-[10px] text-slate-400 truncate text-center">' + esc(label) + '</p>' +
        '</div>';
    }).join("");

    Array.prototype.forEach.call($("photoGrid").querySelectorAll(".photo-btn"), function (btn) {
      btn.addEventListener("click", function () {
        openLightbox(this.getAttribute("data-url"), this.getAttribute("data-label"));
      });
    });

    // Feedback
    var hasFeedback = item.client_rating || item.client_review;
    $("feedbackBlock").classList.toggle("hidden", !hasFeedback);
    if (hasFeedback) {
      var r = item.client_rating || 0;
      $("feedbackStars").textContent = "★".repeat(r) + "☆".repeat(Math.max(0, 5 - r));
      $("feedbackText").textContent = item.client_review || "No written comment.";
    }

    renderList();
    if (window.innerWidth < 768) $("detailPanel").scrollIntoView({ behavior: "smooth" });
  }

  /* ---------- lightbox ---------- */
  function openLightbox(url, label) {
    $("lightboxImg").src = driveThumb(url, 1600);
    $("lightboxLabel").textContent = label;
    $("lightboxOpen").href = url;
    $("lightbox").classList.remove("hidden");
  }
  $("lightboxClose").addEventListener("click", closeLightbox);
  $("lightbox").addEventListener("click", function (e) { if (e.target === this) closeLightbox(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeLightbox(); });
  function closeLightbox() {
    $("lightbox").classList.add("hidden");
    $("lightboxImg").removeAttribute("src");
  }

  /* ---------- actions ---------- */
  async function updateStatus(newStatus) {
    if (!active) return;
    var res = await client.from("palm_inquiries")
      .update({ status: newStatus }).eq("id", active.id).select().single();
    if (res.error) { toast("Couldn't update status: " + res.error.message, "error"); return false; }
    active = res.data;
    var idx = inquiries.findIndex(function (i) { return i.id === active.id; });
    if (idx > -1) inquiries[idx] = active;
    renderList();
    toast("Marked " + newStatus.toLowerCase());
    return true;
  }

  async function saveNotes() {
    if (!active) return;
    $("notesStatus").textContent = "Saving…";
    var res = await client.from("palm_inquiries")
      .update({ astrologer_notes: $("astrologerNotes").value })
      .eq("id", active.id).select().single();
    if (res.error) {
      $("notesStatus").textContent = "";
      toast("Couldn't save notes: " + res.error.message, "error");
      return;
    }
    active = res.data;
    $("notesStatus").textContent = "Saved";
    setTimeout(function () { $("notesStatus").textContent = ""; }, 2500);
  }

  function waNumber(mobile) {
    var digits = String(mobile || "").replace(/\D/g, "");
    if (!digits) return null;
    if (digits.length === 10) digits = "91" + digits;   // default to India
    return digits;
  }

  function openWhatsApp() {
    if (!active) return;
    var num = waNumber(active.mobile);
    if (!num) return toast("No mobile number on this record.", "error");
    window.open("https://wa.me/" + num, "_blank", "noopener");
  }

  function feedbackUrl(id) {
    var base = location.href.replace(/[^/]*$/, "");
    return base + "feedback.html?id=" + encodeURIComponent(id);
  }

  async function completeAndSendFeedback() {
    if (!active) return;
    var target = active;                       // hold a reference before any refresh
    var num = waNumber(target.mobile);
    if (!num) return toast("No mobile number on this record.", "error");

    // Open the tab first — popup blockers reject windows opened after an await.
    var tab = window.open("", "_blank", "noopener");

    var ok = await updateStatus("Completed");
    if (!ok) { if (tab) tab.close(); return; }

    var msg = "Hello " + (target.full_name || "") + ", thank you for your palm reading consultation. " +
              "Please share your rating and review here: " + feedbackUrl(target.id);
    var href = "https://wa.me/" + num + "?text=" + encodeURIComponent(msg);
    if (tab) tab.location.href = href; else window.open(href, "_blank", "noopener");
  }

  /* ---------- boot ---------- */
  if (!client) {
    showLoginError("Supabase library failed to load. Check your connection.");
  } else {
    client.auth.getSession().then(function (res) {
      if (res.data && res.data.session) enterApp(res.data.session);
    });
  }
})();
</script>
</body>
</html>
